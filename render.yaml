# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: malt-ember
    runtime: node
    plan: free
    buildCommand: "echo no build step"
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: TRUST_PROXY
        value: "1"
      - key: ADMIN_TOKEN
        generateValue: true
      - key: DB_PATH
        value: ./data/malt-ember.db
